# servicio independiente ReservaYa-Whatsapp (no interfiere con otras lambdas)
service: reserva-ya-whatsapp

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 256
  timeout: 29
  environment:
    NODE_ENV: production
    WHATSAPP_PHONE_ID: ${env:WHATSAPP_PHONE_ID, ''}
    WHATSAPP_TOKEN: ${env:WHATSAPP_TOKEN, ''}
    WHATSAPP_VERIFY_TOKEN: ${env:WHATSAPP_VERIFY_TOKEN, ''}
    WHATSAPP_APP_SECRET: ${env:WHATSAPP_APP_SECRET, ''}
    WHATSAPP_APP_SECRET_ALT: ${env:WHATSAPP_APP_SECRET_ALT, ''}
    WHATSAPP_WELCOME_TEMPLATE: ${env:WHATSAPP_WELCOME_TEMPLATE, 'bienvenida_reservaya'}
    WHATSAPP_WELCOME_TEMPLATE_LANG: ${env:WHATSAPP_WELCOME_TEMPLATE_LANG, 'es'}
    FYN_WEBHOOK_URL: ${env:FYN_WEBHOOK_URL, ''}
    FYN_PHONE_ID: ${env:FYN_PHONE_ID, '890472847487137'}
    WHATSAPP_API_URL: ${env:WHATSAPP_API_URL, 'https://graph.facebook.com/v21.0'}
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    GROQ_MODEL: ${env:GROQ_MODEL, 'llama-3.3-70b-versatile'}
    RESERVAYA_API_URL: ${env:RESERVAYA_API_URL, ''}
    RESERVAYA_BOT_SECRET: ${env:RESERVAYA_BOT_SECRET, ''}
    RESERVAYA_EVENTS_TOKEN: ${env:RESERVAYA_EVENTS_TOKEN, ''}
    MONGODB_URI: ${env:MONGODB_URI, ''}
    MONGODB_DATABASE: ${env:MONGODB_DATABASE, 'reserva_ya_whatsapp'}
    DEFAULT_CITY: ${env:DEFAULT_CITY, 'Bogotá'}
    ADMIN_SECRET: ${env:ADMIN_SECRET, ''}
    BLOCKED_USERS: ${env:BLOCKED_USERS, ''}

functions:
  api:
    handler: lambda.handler
    events:
      - httpApi: ANY /{proxy+}
      - httpApi: ANY /
      - httpApi: ANY /webhook
      - httpApi: ANY /internal/events
      - httpApi: ANY /health

  reminders:
    handler: lambdaReminders.handler
    events:
      - schedule: rate(10 minutes)

package:
  patterns:
    - '!**/.env'
    - '!**/*.md'
    - '!**/node_modules/.cache/**'